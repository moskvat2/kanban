# =========================================================
# Produção (seguro): docker compose -f docker-compose.prod.yml
#
# Diferenças em relação ao modo dev:
#   - Banco e backend NÃO expõem portas para o host (rede interna)
#   - Frontend: build estático servido pelo nginx (headers de segurança)
#   - Backend: imagem com usuário não-root e uvicorn multi-worker
#   - Sem volume de código (build imutável)
# =========================================================
services:
  db:
    image: mysql:8.4
    container_name: kanban-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kanban_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: kanban-backend-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanban_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: kanban-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - kanban_net

volumes:
  db_data:

networks:
  kanban_net:
    driver: bridge